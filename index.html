<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Layoff Games · 优化游戏</title>
<style>
  :root { --ink: #f4f6fb; --dim: #9aa6b8; --hot: #ff3d71; --ok: #69f0ae; --gold: #ffd54f; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #06070b; color: var(--ink);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }

  #ui { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 16px;
    background: radial-gradient(ellipse at center, rgba(6,7,11,0.72), rgba(6,7,11,0.93)); overflow-y: auto; }
  #ui.on { display: flex; }
  .card { width: min(620px, 100%); margin: auto; text-align: center; padding: 8px 4px; animation: pop 0.25s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: none; } }
  .kicker { font-size: 12px; letter-spacing: 0.22em; color: var(--hot); font-weight: 800; margin-bottom: 10px; }
  h1 { margin: 0; font-size: clamp(34px, 8.5vw, 68px); line-height: 1; font-weight: 900; letter-spacing: -0.01em;
    text-shadow: 0 0 28px rgba(255,61,113,0.55), 3px 3px 0 var(--hot); }
  h1.red { color: #ff8a9f; }
  h1.green { color: var(--ok); text-shadow: 0 0 28px rgba(105,240,174,0.5), 3px 3px 0 #0f7a4c; }
  h2 { margin: 10px 0 0; font-size: clamp(18px, 4vw, 28px); font-weight: 800; color: var(--gold); letter-spacing: 0.3em; text-indent: 0.3em; }
  h3 { margin: 0 0 16px; font-size: 22px; font-weight: 800; }
  p { margin: 14px auto; max-width: 520px; line-height: 1.55; }
  .tag { font-size: 17px; color: var(--ink); }
  .story { font-size: 16px; color: #d6dcea; }
  .story.hi { color: var(--gold); font-weight: 700; }
  .ctl { font-size: 12.5px; color: var(--dim); }
  .disc { font-size: 11.5px; color: #6f7b8e; max-width: 460px; }
  button { font: inherit; color: var(--ink); cursor: pointer; border: 0; border-radius: 12px; }
  button.big { display: block; margin: 18px auto 12px; padding: 15px 34px; min-width: 240px; font-size: 18px; font-weight: 900; letter-spacing: 0.08em;
    background: var(--hot); box-shadow: 0 5px 0 #a3163f, 0 0 30px rgba(255,61,113,0.4); transition: transform 0.06s; }
  button.big:hover { filter: brightness(1.1); }
  button.big:active { transform: translateY(4px); box-shadow: 0 1px 0 #a3163f; }
  button.ghost { padding: 9px 16px; font-size: 13px; font-weight: 700; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.18); }
  button.ghost:hover { background: rgba(255,255,255,0.16); }
  .row { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
  .perks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .perk { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 20px 10px; background: rgba(255,255,255,0.07);
    border: 1.5px solid rgba(255,255,255,0.2); transition: transform 0.1s, border-color 0.1s, background 0.1s; }
  .perk:hover { transform: translateY(-4px); border-color: var(--gold); background: rgba(255,213,79,0.12); }
  .perk .ic { font-size: 38px; }
  .perk b { font-size: 16px; color: var(--gold); }
  .perk small { font-size: 12.5px; color: #c6cedb; line-height: 1.4; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 18px auto; max-width: 480px; }
  .stats div { background: rgba(255,255,255,0.06); border-radius: 10px; padding: 9px 6px; }
  .stats span { display: block; font-size: 11px; color: var(--dim); }
  .stats b { font-size: 19px; font-variant-numeric: tabular-nums; }
  @media (max-width: 520px) { .perks { grid-template-columns: 1fr; } .perk { flex-direction: row; text-align: left; padding: 12px 14px; } .perk .ic { font-size: 30px; } .perk small { margin-left: auto; text-align: right; max-width: 46%; } }

  #touch { display: none; }
  body.touch #touch { display: block; }
  #touch button { position: fixed; width: 62px; height: 62px; border-radius: 50%; font-size: 24px; background: rgba(255,255,255,0.14);
    border: 2px solid rgba(255,255,255,0.35); }
  #touch button:active { background: rgba(255,255,255,0.3); }
  #tb-dash { right: 18px; bottom: calc(150px + env(safe-area-inset-bottom)); }
  #tb-swap { right: 92px; bottom: calc(96px + env(safe-area-inset-bottom)); width: 52px !important; height: 52px !important; font-size: 20px !important; }
  #tb-pause { right: 12px; top: calc(92px + env(safe-area-inset-top)); width: 40px !important; height: 40px !important; font-size: 15px !important; }
  #ui.on ~ #touch { display: none !important; }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="touch">
  <button id="tb-dash" aria-label="Dash">💨</button>
  <button id="tb-swap" aria-label="Switch weapon">🔁</button>
  <button id="tb-pause" aria-label="Pause">⏸</button>
</div>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="js/world.js"></script>
<script src="js/bosses.js"></script>
<script src="js/game.js"></script>
</body>
</html>
