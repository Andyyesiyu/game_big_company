<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Layoff Games · 优化游戏</title>
<style>
  /* One committed look: a bright cel-shaded meadow, ink outlines, cream panels. */
  :root { --ink: #2a2438; --cream: #fffaf0; --dim: #6f6787; --hot: #ff5a6e; --ok: #2fbf7a; --gold: #f2b01e; --sky: #56b4e8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #gl { display: none; pointer-events: none; }

  #ui { position: fixed; inset: 0; display: none; padding: 16px; overflow-y: auto;
    background: radial-gradient(ellipse at center, rgba(42,36,56,0.25), rgba(42,36,56,0.62)); }
  #ui.on { display: flex; }
  .card { width: min(640px, 100%); margin: auto; text-align: center; padding: 26px 22px 20px; background: var(--cream);
    border: 3px solid var(--ink); border-radius: 26px; box-shadow: 0 8px 0 var(--ink); animation: pop 0.25s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }
  .kicker { font-size: 12px; letter-spacing: 0.2em; color: var(--hot); font-weight: 800; margin-bottom: 10px; }
  h1 { margin: 0; font-size: clamp(32px, 8vw, 60px); line-height: 1.02; font-weight: 900; letter-spacing: -0.01em; color: var(--ink);
    font-family: Georgia, "Songti SC", "STSong", "Noto Serif SC", serif; text-wrap: balance; }
  h1.red { color: var(--hot); }
  h1.green { color: var(--ok); }
  h1.gold { color: var(--gold); -webkit-text-stroke: 1.5px var(--ink); }
  h2 { margin: 8px 0 0; font-size: clamp(15px, 3.4vw, 22px); font-weight: 800; color: var(--gold); letter-spacing: 0.3em; text-indent: 0.3em; }
  p { margin: 12px auto; max-width: 520px; line-height: 1.55; }
  .tag { font-size: 16px; }
  .story { font-size: 15.5px; }
  .story.dim { color: var(--dim); font-style: italic; }
  .story.hi { color: var(--ok); font-weight: 800; }
  .ctl { font-size: 12.5px; color: var(--dim); }
  .disc { font-size: 11.5px; color: #9a93ad; max-width: 480px; }
  .bank { font-size: 13px; color: var(--dim); margin: 6px 0; }
  .bank b { color: var(--ink); font-size: 16px; font-variant-numeric: tabular-nums; }
  .pips { font-size: 13px; font-weight: 800; -webkit-text-stroke: 0.6px var(--ink); min-height: 1em; }
  button { font: inherit; color: var(--ink); cursor: pointer; border: 0; border-radius: 999px; }
  button.big { display: block; margin: 16px auto 12px; padding: 14px 34px; min-width: 240px; font-size: 18px; font-weight: 900; letter-spacing: 0.08em;
    color: #fff; background: var(--hot); border: 3px solid var(--ink); box-shadow: 0 5px 0 var(--ink); transition: transform 0.06s; }
  button.big:hover { filter: brightness(1.08); }
  button.big:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--ink); }
  button.ghost { padding: 8px 16px; font-size: 13px; font-weight: 800; background: #fff; border: 2px solid var(--ink); }
  button.ghost:hover:not(:disabled) { background: #ffe9a8; }
  button.ghost:disabled { opacity: 0.5; cursor: default; }
  .row { flex-wrap: wrap; }
  button:focus-visible { outline: 3px solid var(--sky); outline-offset: 2px; }
  .row { display: flex; gap: 10px; justify-content: center; margin: 10px 0; }
  .rules { text-align: left; margin: 0 auto 14px; padding-left: 20px; max-width: 520px; font-size: 13.5px; line-height: 1.5; color: #4a4360; }
  .perks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 8px; }
  .perk { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 16px 10px; background: #fff; border-radius: 18px;
    border: 3px solid var(--ink); box-shadow: 0 4px 0 var(--ink); transition: transform 0.1s, background 0.1s; }
  .perk:hover:not(:disabled) { transform: translateY(-3px); background: #fff3c9; }
  .perk:disabled { opacity: 0.45; cursor: not-allowed; }
  .perk .ic { font-size: 34px; }
  .perk b { font-size: 16px; }
  .perk small { font-size: 12px; color: var(--dim); line-height: 1.4; min-width: 0; }
  .perk em { font-style: normal; font-weight: 900; color: var(--gold); -webkit-text-stroke: 0.5px var(--ink); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px auto 8px; max-width: 500px; }
  .stats div { background: #fff; border: 2px solid var(--ink); border-radius: 14px; padding: 8px 6px; min-width: 0; }
  .stats span { display: block; font-size: 11px; color: var(--dim); }
  .stats b { font-size: 18px; font-variant-numeric: tabular-nums; }
  .stats s { color: var(--hot); }
  @media (max-width: 520px) { .perks { grid-template-columns: 1fr; } .perk { flex-direction: row; text-align: left; padding: 10px 14px; gap: 10px; } .perk .ic { font-size: 26px; } .perk small { flex: 1; } .stats { grid-template-columns: repeat(2, 1fr); } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  #touch { display: none; }
  body.touch #touch { display: block; }
  #touch button { position: fixed; width: 62px; height: 62px; font-size: 24px; background: rgba(255,255,255,0.55); border: 3px solid var(--ink); }
  #touch button:active { background: #fff; }
  #tb-pause { right: max(12px, env(safe-area-inset-right)); top: calc(200px + env(safe-area-inset-top)); width: 40px !important; height: 40px !important; font-size: 15px !important; }
  #ui.on ~ #touch { display: none !important; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="touch">
  <button id="tb-pause" aria-label="Pause">⏸</button>
</div>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="js/post.js"></script>
<script src="js/world.js"></script>
<script src="js/bosses.js"></script>
<script src="js/game.js"></script>
</body>
</html>
