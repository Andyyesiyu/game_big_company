<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Layoff Games · 优化游戏</title>
<style>
  /* Menus are things on a desk: a clipboard of paper, a big red push-button, keycaps, a coin tray. */
  :root { --ink: #2a2438; --cream: #fffaf0; --dim: #6f6787; --hot: #ff5a6e; --ok: #2fbf7a; --gold: #f2b01e; --sky: #56b4e8; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--sky); color: var(--ink);
    font-family: "Trebuchet MS", "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
  #gl, #c3 { display: none; pointer-events: none; }

  #ui { position: fixed; inset: 0; display: none; padding: 34px 16px 22px; overflow-y: auto;
    background: radial-gradient(ellipse at center, rgba(42,36,56,0.3), rgba(42,36,56,0.7)); }
  #ui.on { display: flex; }
  .card { position: relative; width: min(600px, 100%); margin: auto; text-align: center; padding: 40px 24px 24px;
    background: repeating-linear-gradient(#fffdf6 0 31px, #e9eef5 31px 32px); background-color: #fffdf6;
    border: 3px solid var(--ink); border-radius: 14px;
    box-shadow: inset 0 0 40px rgba(180,150,90,0.18), 0 0 0 9px #c08a4e, 0 0 0 12px var(--ink), 0 10px 0 12px #8a5a2c, 0 10px 0 15px var(--ink), 0 34px 44px rgba(0,0,0,0.4);
    animation: pop 0.25s ease-out; }
  /* the clip that holds the sheet */
  .card::before { content: ""; position: absolute; left: 50%; top: -26px; width: 150px; height: 42px; transform: translateX(-50%);
    background: linear-gradient(#f4f6f8, #aeb6c2 55%, #7d8794); border: 3px solid var(--ink); border-radius: 12px 12px 8px 8px;
    box-shadow: inset 0 3px 0 rgba(255,255,255,0.8), 0 4px 0 rgba(0,0,0,0.25); }
  .card::after { content: ""; position: absolute; left: 50%; top: -15px; width: 46px; height: 14px; transform: translateX(-50%);
    background: #4a4560; border: 3px solid var(--ink); border-radius: 8px; box-shadow: inset 0 3px 3px rgba(0,0,0,0.5); }
  @keyframes pop { from { opacity: 0; transform: translateY(12px) scale(0.97); } to { opacity: 1; transform: none; } }
  .kicker { display: inline-block; font-size: 13px; letter-spacing: 0.18em; color: #fff; font-weight: 900; margin-bottom: 14px; padding: 5px 14px;
    background: var(--hot); border: 2.5px solid var(--ink); border-radius: 6px; transform: rotate(-2deg); box-shadow: 0 3px 0 var(--ink); }
  h1 { margin: 0; font-size: clamp(34px, 8.5vw, 64px); line-height: 1.02; font-weight: 900; letter-spacing: -0.01em; color: var(--ink);
    font-family: Georgia, "Songti SC", "STSong", "Noto Serif SC", serif; text-wrap: balance; text-shadow: 0 3px 0 rgba(42,36,56,0.14); }
  h1.red { color: var(--hot); }
  h1.green { color: var(--ok); }
  h1.gold { color: var(--gold); -webkit-text-stroke: 1.5px var(--ink); }
  h2 { margin: 8px 0 4px; font-size: clamp(16px, 3.6vw, 24px); font-weight: 900; color: var(--gold); letter-spacing: 0.3em; text-indent: 0.3em; -webkit-text-stroke: 0.8px var(--ink); }
  p { margin: 12px auto; max-width: 500px; line-height: 1.5; }
  .story { font-size: 17px; font-weight: 700; }
  .story.hi { color: var(--ok); font-weight: 900; }
  .disc { font-size: 11px; color: #a39cb5; max-width: 460px; margin-bottom: 0; }
  .pips { font-size: 14px; font-weight: 800; -webkit-text-stroke: 0.6px var(--ink); min-height: 1em; }

  /* the coin tray */
  .bank { display: inline-flex; align-items: center; gap: 10px; margin: 6px 0 10px; padding: 7px 18px 7px 9px; border-radius: 999px;
    background: linear-gradient(#2a2438, #3d3654); border: 3px solid var(--ink); box-shadow: inset 0 4px 8px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.7); }
  .bank i { width: 26px; height: 26px; border-radius: 50%; border: 2.5px solid var(--ink);
    background: radial-gradient(circle at 35% 30%, #fff3b8, #f2b01e 60%, #c98a12); box-shadow: 0 2px 0 #8a5a08; }
  .bank b { color: #ffe08a; font-size: 20px; font-weight: 900; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }

  button { font: inherit; color: var(--ink); cursor: pointer; border: 0; border-radius: 999px; }
  /* the big red button */
  button.big { display: block; margin: 22px auto 22px; padding: 17px 40px; min-width: 250px; font-size: 22px; font-weight: 900; letter-spacing: 0.1em;
    color: #fff; text-shadow: 0 2px 0 rgba(120,20,40,0.6); border: 3px solid var(--ink);
    background: linear-gradient(#ff97a3, #ff5a6e 42%, #e2364f);
    box-shadow: inset 0 4px 0 rgba(255,255,255,0.55), inset 0 -5px 0 rgba(120,20,40,0.28), 0 8px 0 #96203a, 0 8px 0 3px var(--ink), 0 18px 18px rgba(0,0,0,0.28);
    transition: transform 0.06s, box-shadow 0.06s; }
  button.big:hover { filter: brightness(1.07); }
  button.big:active { transform: translateY(6px); box-shadow: inset 0 4px 0 rgba(255,255,255,0.4), inset 0 -3px 0 rgba(120,20,40,0.28), 0 2px 0 #96203a, 0 2px 0 3px var(--ink), 0 6px 8px rgba(0,0,0,0.28); }
  /* keycaps */
  button.ghost { padding: 9px 16px; font-size: 13.5px; font-weight: 800; border: 2.5px solid var(--ink); border-radius: 10px;
    background: linear-gradient(#ffffff, #e4dfee); box-shadow: inset 0 2px 0 #fff, 0 4px 0 #a39cb8, 0 4px 0 2.5px var(--ink); transition: transform 0.06s, box-shadow 0.06s; }
  button.ghost:hover:not(:disabled) { background: linear-gradient(#fff9e0, #ffe9a8); }
  button.ghost:active:not(:disabled) { transform: translateY(3px); box-shadow: inset 0 2px 0 #fff, 0 1px 0 #a39cb8, 0 1px 0 2.5px var(--ink); }
  button.ghost:disabled { opacity: 0.5; cursor: default; }
  button:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 14px 0; }
  kbd { display: inline-block; min-width: 30px; margin: 0 2px; padding: 4px 8px; font: 900 14px/1.2 inherit; font-family: inherit; color: var(--ink); text-align: center;
    background: linear-gradient(#ffffff, #e4dfee); border: 2.5px solid var(--ink); border-radius: 8px; box-shadow: inset 0 2px 0 #fff, 0 3px 0 #a39cb8, 0 3px 0 2.5px var(--ink); }
  kbd.l { color: #fff; background: linear-gradient(#ff97a3, #ff5a6e); box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), 0 3px 0 #96203a, 0 3px 0 2.5px var(--ink); }
  kbd.h { color: #fff; background: linear-gradient(#ffb57a, #ff8a3c); box-shadow: inset 0 2px 0 rgba(255,255,255,0.5), 0 3px 0 #a84e12, 0 3px 0 2.5px var(--ink); }
  .keys { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px 14px; margin: 8px auto 18px; max-width: 500px; text-align: left; }
  .keys div { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .keys span { font-size: 15px; font-weight: 800; }
  .keys.combos { padding-top: 16px; border-top: 3px dashed #cfc8dc; }
  .rules { text-align: left; margin: 0 auto 18px; padding-left: 20px; max-width: 500px; font-size: 14px; line-height: 1.5; color: #4a4360; }
  .rules li { margin: 5px 0; }

  /* the three kits, as cards you pick up */
  .perks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; margin: 6px 0 20px; }
  .perk { display: flex; flex-direction: column; align-items: center; gap: 7px; padding: 18px 10px 14px; border-radius: 16px; border: 3px solid var(--ink);
    background: linear-gradient(#ffffff, #f1ecde); box-shadow: inset 0 3px 0 #fff, 0 6px 0 #b9ae93, 0 6px 0 3px var(--ink), 0 14px 14px rgba(0,0,0,0.18); transition: transform 0.1s, box-shadow 0.1s; }
  .perk:hover:not(:disabled) { transform: translateY(-4px); background: linear-gradient(#fffbe6, #ffe9a8); }
  .perk:active:not(:disabled) { transform: translateY(4px); box-shadow: inset 0 3px 0 #fff, 0 2px 0 #b9ae93, 0 2px 0 3px var(--ink); }
  .perk:disabled { opacity: 0.45; cursor: not-allowed; }
  .perk .ic { font-size: 42px; filter: drop-shadow(0 3px 0 rgba(42,36,56,0.25)); }
  .perk b { font-size: 17px; }
  .perk small { font-size: 12.5px; color: var(--dim); line-height: 1.35; min-width: 0; }
  .perk em { font-style: normal; font-weight: 900; font-size: 15px; color: #ffe08a; padding: 3px 12px; border-radius: 999px; background: var(--ink); box-shadow: inset 0 2px 4px rgba(0,0,0,0.6); }
  /* results: counters set into the board */
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 18px auto 10px; max-width: 500px; }
  .stats div { min-width: 0; padding: 9px 6px 8px; border: 3px solid var(--ink); border-radius: 12px; background: linear-gradient(#2a2438, #3d3654); box-shadow: inset 0 4px 8px rgba(0,0,0,0.55), 0 2px 0 rgba(255,255,255,0.7); }
  .stats span { display: block; font-size: 11px; font-weight: 700; color: #b3acc9; letter-spacing: 0.04em; }
  .stats b { font-size: 21px; color: #fff3c4; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,0.4); }
  .stats s { color: #ff8fa0; }
  @media (max-width: 520px) { .perks { grid-template-columns: 1fr; } .perk { flex-direction: row; text-align: left; padding: 10px 14px; gap: 10px; } .perk .ic { font-size: 28px; } .perk small { flex: 1; } .stats { grid-template-columns: repeat(2, 1fr); } .keys { grid-template-columns: 1fr; } }
  @media (prefers-reduced-motion: reduce) { .card { animation: none; } }

  #touch { display: none; }
  body.touch #touch { display: block; }
  #touch button { position: fixed; width: 62px; height: 62px; font-size: 24px; border: 2.5px solid var(--ink); border-radius: 12px;
    background: linear-gradient(#ffffff, #e4dfee); box-shadow: inset 0 2px 0 #fff, 0 3px 0 #a39cb8, 0 3px 0 2.5px var(--ink); }
  #touch button:active { transform: translateY(2px); }
  #tb-pause { right: max(12px, env(safe-area-inset-right)); top: calc(232px + env(safe-area-inset-top)); width: 40px !important; height: 40px !important; font-size: 15px !important; }
  #ui.on ~ #touch { display: none !important; }
</style>
</head>
<body>
<canvas id="c3"></canvas>
<canvas id="gl"></canvas>
<canvas id="cv"></canvas>
<div id="ui"></div>
<div id="touch">
  <button id="tb-pause" aria-label="Pause">⏸</button>
</div>
<script src="vendor/three.min.js"></script>
<script src="vendor/GLTFLoader.js"></script>
<script src="vendor/SkeletonUtils.js"></script>
<script src="assets/models.js"></script>
<script src="js/i18n.js"></script>
<script src="js/core.js"></script>
<script src="js/draw.js"></script>
<script src="js/post.js"></script>
<script src="js/world.js"></script>
<script src="js/bosses.js"></script>
<script src="js/r3world.js"></script>
<script src="js/r3actors.js"></script>
<script src="js/r3models.js"></script>
<script src="js/r3office.js"></script>
<script src="js/game.js"></script>
</body>
</html>
